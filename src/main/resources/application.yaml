spring:
  application:
    name: ShortsB-BE
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope: openid,profile,email

server:
  servlet:
    session:
      # ponytail: 단일 서버 메모리 세션. 다중 서버에서 인증 유지가 필요하면 외부 세션 저장소로 전환한다.
      timeout: ${SERVER_SERVLET_SESSION_TIMEOUT:30m}
      persistent: false
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        # 프로필 미지정 시에도 HTTPS 전용 쿠키를 기본으로 사용한다.
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}
        same-site: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:lax}

app:
  recommendation:
    prompt-weight: ${APP_RECOMMENDATION_PROMPT_WEIGHT:}
  embedding:
    base-url: ${APP_EMBEDDING_BASE_URL:}
    api-key: ${APP_EMBEDDING_API_KEY:}
    connect-timeout: ${APP_EMBEDDING_CONNECT_TIMEOUT:}
    read-timeout: ${APP_EMBEDDING_READ_TIMEOUT:}
  auth:
    login-success-url: ${APP_LOGIN_SUCCESS_URL}
    login-failure-url: ${APP_LOGIN_FAILURE_URL}
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
